default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: peer_review_backend_development

test:
  <<: *default
  database: peer_review_backend_test

production:
  primary: &primary_production
    <<: *default
    database: peer_review_backend_production
    username: peer_review_backend
    password: <%= ENV["PEER_REVIEW_BACKEND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: peer_review_backend_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: peer_review_backend_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: peer_review_backend_production_cable
    migrations_paths: db/cable_migrate
