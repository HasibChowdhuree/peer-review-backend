service: peer_review_backend

image: peer_review_backend

servers:
  web:
    - 192.168.0.1

registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "peer_review_backend_storage:/rails/storage"

builder:
  arch: amd64